
name: Build ACPI Driver

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2025-vs2026

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install WDK and SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = "10.0.28000.2526"

          Invoke-WebRequest `
            https://dist.nuget.org/win-x86-commandline/latest/nuget.exe `
            -OutFile nuget.exe

          $packages = @(
            "Microsoft.Windows.WDK.x64",
            "Microsoft.Windows.SDK.CPP",
            "Microsoft.Windows.SDK.CPP.x64"
          )

          foreach ($pkg in $packages) {
            & .\nuget.exe install $pkg `
              -Version $version `
              -OutputDirectory packages `
              -Source https://api.nuget.org/v3/index.json `
              -NonInteractive

            if ($LASTEXITCODE -ne 0) {
              throw "NuGet install failed: $pkg"
            }
          }

          @'
          <Project>
            <Import Project="packages\Microsoft.Windows.WDK.x64.10.0.28000.2526\build\native\Microsoft.Windows.WDK.x64.props" />
            <Import Project="packages\Microsoft.Windows.SDK.CPP.x64.10.0.28000.2526\build\native\Microsoft.Windows.SDK.cpp.x64.props" />
            <Import Project="packages\Microsoft.Windows.SDK.CPP.10.0.28000.2526\build\native\Microsoft.Windows.SDK.cpp.props" />
          </Project>
          '@ | Set-Content Directory.Build.props -Encoding utf8

      - name: Build x64 Release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "Searching for stampinf.exe..."

          $roots = @("packages")
          $kits = "C:\Program Files (x86)\Windows Kits"

          if (Test-Path $kits) {
            $roots += $kits
          }

          $tools = @(
            Get-ChildItem -Path $roots `
              -Filter stampinf.exe `
              -File -Recurse `
              -ErrorAction SilentlyContinue
          )

          if ($tools.Count -eq 0) {
            throw "stampinf.exe not found in WDK packages"
          }

          $tool = $tools |
            Where-Object { $_.FullName -match 'x64|amd64' } |
            Select-Object -First 1

          if (-not $tool) {
            $tool = $tools | Select-Object -First 1
          }

          Write-Host "Found: $($tool.FullName)"
          $env:PATH = "$($tool.DirectoryName);$env:PATH"

          & msbuild acpifiltr.sln `
            /m `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /v:minimal

          if ($LASTEXITCODE -ne 0) {
            throw "Driver build failed"
          }

      - name: Collect driver files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force output | Out-Null

          $sys = Get-ChildItem -Recurse -Filter acpifiltr.sys |
            Where-Object {
              $_.FullName -notmatch '\\packages\\|\\output\\'
            } |
            Select-Object -First 1

          if (-not $sys) {
            throw "acpifiltr.sys not found"
          }

          Copy-Item $sys.FullName output\
          Copy-Item acpifiltr.inf output\

      - name: Upload driver
        uses: actions/upload-artifact@v4
        with:
          name: acpifiltr-x64
          path: output/
          if-no-files-found: error
