name: Build ACPI Driver - Fixed Global Event

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2025-vs2026
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install WDK and SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '10.0.28000.2526'
          Invoke-WebRequest 'https://dist.nuget.org/win-x86-commandline/latest/nuget.exe' -OutFile nuget.exe
          $packages = @('Microsoft.Windows.WDK.x64', 'Microsoft.Windows.SDK.CPP', 'Microsoft.Windows.SDK.CPP.x64')
          foreach ($pkg in $packages) {
            & .\nuget.exe install $pkg -Version $version -OutputDirectory packages -Source 'https://api.nuget.org/v3/index.json' -NonInteractive
            if ($LASTEXITCODE -ne 0) { throw "NuGet installation failed: $pkg" }
          }
          @'
          <Project>
            <Import Project="packages\Microsoft.Windows.WDK.x64.10.0.28000.2526\build\native\Microsoft.Windows.WDK.x64.props" />
            <Import Project="packages\Microsoft.Windows.SDK.CPP.x64.10.0.28000.2526\build\native\Microsoft.Windows.SDK.cpp.x64.props" />
            <Import Project="packages\Microsoft.Windows.SDK.CPP.10.0.28000.2526\build\native\Microsoft.Windows.SDK.cpp.props" />
          </Project>
          '@ | Set-Content Directory.Build.props -Encoding utf8

      - name: Fix event object kernel path
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = [IO.File]::ReadAllText((Join-Path $PWD 'filter.c'))
          $old = 'L"\\BaseNamedObjects\\Global\\{29DFB10F-5CFF-4A9D-B9D1-31B053A1AE95}"'
          $new = 'L"\\BaseNamedObjects\\{29DFB10F-5CFF-4A9D-B9D1-31B053A1AE95}"'
          if (-not $source.Contains($old)) { throw 'Expected original event path not found; source may have changed' }
          $source = $source.Replace($old, $new)
          [IO.File]::WriteAllText((Join-Path $PWD 'filter.c'), $source)
          Write-Host 'Corrected kernel event path.'
          Select-String -Path filter.c -Pattern 'BaseNamedObjects'

      - name: Build x64 Release
        id: driverbuild
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tool = Get-ChildItem packages -Recurse -File -Filter stampinf.exe |
            Where-Object { $_.Directory.Name -ieq 'x64' } |
            Select-Object -First 1
          if (-not $tool) { throw 'x64 stampinf.exe not found' }
          $env:PATH = "$($tool.DirectoryName);$env:PATH"
          & msbuild acpifiltr.sln /m /p:Configuration=Release /p:Platform=x64 /v:minimal
          if ($LASTEXITCODE -ne 0) { Write-Warning 'Validation failed; collecting SYS if produced'; exit 1 }

      - name: Collect driver and patched source
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force output | Out-Null
          $sys = 'x64\Release\acpifiltr.sys'
          if (Test-Path $sys) {
            Copy-Item $sys output\
            Get-FileHash $sys -Algorithm SHA256 | Format-List
          } else { Write-Warning 'SYS not found' }
          if (Test-Path 'x64\Release\acpifiltr.inf') { Copy-Item 'x64\Release\acpifiltr.inf' output\ }
          Copy-Item filter.c output\filter_patched.c

      - name: Upload driver artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acpifiltr-event-path-fixed
          path: output/
          if-no-files-found: error
