
name: Build ACPI Driver

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2025-vs2026

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install WDK and SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = "10.0.28000.2526"

          Invoke-WebRequest `
            https://dist.nuget.org/win-x86-commandline/latest/nuget.exe `
            -OutFile nuget.exe

          $packages = @(
            "Microsoft.Windows.WDK.x64",
            "Microsoft.Windows.SDK.CPP",
            "Microsoft.Windows.SDK.CPP.x64"
          )

          foreach ($pkg in $packages) {
            Write-Host "Installing $pkg"

            & .\nuget.exe install $pkg `
              -Version $version `
              -OutputDirectory packages `
              -Source https://api.nuget.org/v3/index.json `
              -NonInteractive

            if ($LASTEXITCODE -ne 0) {
              throw "NuGet installation failed: $pkg"
            }
          }

          @'
          <Project>
            <Import Project="packages\Microsoft.Windows.WDK.x64.10.0.28000.2526\build\native\Microsoft.Windows.WDK.x64.props" />
            <Import Project="packages\Microsoft.Windows.SDK.CPP.x64.10.0.28000.2526\build\native\Microsoft.Windows.SDK.cpp.x64.props" />
            <Import Project="packages\Microsoft.Windows.SDK.CPP.10.0.28000.2526\build\native\Microsoft.Windows.SDK.cpp.props" />
          </Project>
          '@ | Set-Content Directory.Build.props -Encoding utf8

          $header = Get-ChildItem packages `
            -Recurse -Filter ntifs.h -File |
            Select-Object -First 1

          if (-not $header) {
            throw "WDK header ntifs.h missing"
          }

          Write-Host "Found header: $($header.FullName)"

      - name: Build x64 Release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "Searching for x64 stampinf.exe..."

          $roots = @("packages")
          $kits = "C:\Program Files (x86)\Windows Kits"

          if (Test-Path $kits) {
            $roots += $kits
          }

          $tools = @(
            Get-ChildItem -Path $roots `
              -Filter stampinf.exe `
              -File -Recurse `
              -ErrorAction SilentlyContinue
          )

          if ($tools.Count -eq 0) {
            throw "stampinf.exe not found"
          }

          Write-Host "Available stampinf tools:"

          foreach ($item in $tools) {
            Write-Host $item.FullName
          }

          # Select the x64 executable only
          $tool = $tools |
            Where-Object {
              $_.Directory.Name -ieq "x64"
            } |
            Select-Object -First 1

          if (-not $tool) {
            throw "x64 stampinf.exe not found"
          }

          Write-Host "Selected: $($tool.FullName)"

          # Add the x64 WDK tool folder to PATH
          $env:PATH = "$($tool.DirectoryName);$env:PATH"

          Write-Host "Starting x64 Release build..."

          & msbuild acpifiltr.sln `
            /m `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /v:minimal

          if ($LASTEXITCODE -ne 0) {
            throw "Driver build failed"
          }

          Write-Host "MSBuild completed successfully"

      - name: Collect driver files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          New-Item -ItemType Directory `
            -Force -Path output | Out-Null

          $sys = Get-ChildItem -Path . `
            -Recurse -Filter acpifiltr.sys -File |
            Where-Object {
              $_.FullName -notmatch '\\packages\\|\\output\\'
            } |
            Select-Object -First 1

          if (-not $sys) {
            throw "acpifiltr.sys not found"
          }

          Write-Host "Found driver: $($sys.FullName)"
          Copy-Item $sys.FullName output\

          $inf = Get-ChildItem -Path . `
            -Recurse -Filter acpifiltr.inf -File |
            Where-Object {
              $_.FullName -notmatch '\\packages\\|\\output\\'
            } |
            Select-Object -First 1

          if ($inf) {
            Copy-Item $inf.FullName output\
          }

          Write-Host "Collected files:"
          Get-ChildItem output

      - name: Upload driver
        uses: actions/upload-artifact@v4
        with:
          name: acpifiltr-x64
          path: output/
          if-no-files-found: error
