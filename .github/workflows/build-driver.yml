
name: Build ACPI Driver

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2025-vs2026

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install WDK and SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = "10.0.28000.2526"

          Invoke-WebRequest `
            https://dist.nuget.org/win-x86-commandline/latest/nuget.exe `
            -OutFile nuget.exe

          $packages = @(
            "Microsoft.Windows.WDK.x64",
            "Microsoft.Windows.SDK.CPP",
            "Microsoft.Windows.SDK.CPP.x64"
          )

          foreach ($pkg in $packages) {
            Write-Host "Installing $pkg"

            & .\nuget.exe install $pkg `
              -Version $version `
              -OutputDirectory packages `
              -Source https://api.nuget.org/v3/index.json `
              -NonInteractive

            if ($LASTEXITCODE -ne 0) {
              throw "NuGet installation failed: $pkg"
            }
          }

          @'
          <Project>
            <Import Project="packages\Microsoft.Windows.WDK.x64.10.0.28000.2526\build\native\Microsoft.Windows.WDK.x64.props" />
            <Import Project="packages\Microsoft.Windows.SDK.CPP.x64.10.0.28000.2526\build\native\Microsoft.Windows.SDK.cpp.x64.props" />
            <Import Project="packages\Microsoft.Windows.SDK.CPP.10.0.28000.2526\build\native\Microsoft.Windows.SDK.cpp.props" />
          </Project>
          '@ | Set-Content Directory.Build.props -Encoding utf8

          $header = Get-ChildItem packages `
            -Recurse -Filter ntifs.h -File |
            Select-Object -First 1

          if (-not $header) {
            throw "WDK header ntifs.h missing"
          }

          Write-Host "Found: $($header.FullName)"

      - name: Build x64 Release
        id: driverbuild
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $tools = @(
            Get-ChildItem packages `
              -Filter stampinf.exe `
              -File -Recurse
          )

          $tool = $tools |
            Where-Object {
              $_.Directory.Name -ieq "x64"
            } |
            Select-Object -First 1

          if (-not $tool) {
            throw "x64 stampinf.exe not found"
          }

          Write-Host "Selected: $($tool.FullName)"

          $env:PATH = "$($tool.DirectoryName);$env:PATH"

          Write-Host "Building x64 Release driver..."

          & msbuild acpifiltr.sln `
            /m `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /v:minimal

          if ($LASTEXITCODE -ne 0) {
            Write-Warning "Build or validation failed"
            exit 1
          }

      - name: Collect driver output
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          New-Item -ItemType Directory `
            -Force output | Out-Null

          $buildDir = "x64\Release"
          $sys = Join-Path $buildDir "acpifiltr.sys"

          if (Test-Path $sys) {
            Copy-Item $sys output\

            Write-Host "Driver file collected:"
            Get-Item $sys |
              Select-Object Name,Length,FullName

            Write-Host "SHA256:"
            Get-FileHash $sys -Algorithm SHA256 |
              Format-List

            Write-Host "Signature information:"
            Get-AuthenticodeSignature $sys |
              Format-List Status,SignerCertificate
          }
          else {
            Write-Warning "Driver SYS not found"
          }

          $inf = Join-Path $buildDir "acpifiltr.inf"

          if (Test-Path $inf) {
            Copy-Item $inf output\
          }
          elseif (Test-Path "acpifiltr.inf") {
            Copy-Item "acpifiltr.inf" output\
          }

          if (Test-Path "output\acpifiltr.sys") {
            Write-Host "SYS successfully collected"
          }

      - name: Upload compiled driver
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acpifiltr-x64-test
          path: output/
          if-no-files-found: warn
          retention-days: 30

      - name: Check build status
        if: always()
        shell: pwsh
        env:
          BUILD_OUTCOME: ${{ steps.driverbuild.outcome }}
        run: |
          if ($env:BUILD_OUTCOME -ne "success") {
            throw "Driver build or validation failed. Check the logs; the SYS artifact may still be available."
          }

          Write-Host "Driver build and validation succeeded."
